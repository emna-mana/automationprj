[chemins]
; Emplacement de Steel Projects sur ce PC.
steel_projects_exe = C:\Program Files (x86)\SteelProjects\Sp.Plm\Sp.Plm.exe

; Dossier où le programme enregistre les PDF et rapports générés.
dossier_projets = %USERPROFILE%\Desktop\projetTravailler

; Dossier parent des projets XML/TSM à importer.
dossier_sources = %USERPROFILE%\Desktop\projetsATravailler

; Dossier réseau des croquis. Vous pouvez remplacer Y: par un chemin réseau UNC,
; par exemple \\serveur\partage\{affaire}-IRISOLARIS\...\CROQUIS\DEBITAGE.
dossier_croquis = Y:\{affaire}-IRISOLARIS\4.DOSSIER DE FABRICATION\STRUCTURE\CROQUIS\DEBITAGE

; Classeur des fers plats disponible sur ce PC.
fichier_fer_plat = %USERPROFILE%\Desktop\projetsATravailler\FER PLAT.xlsx

fichier_trusquinage_A164 = %USERPROFILE%\Desktop\projetsATravailler\trusquinage A164.pdf